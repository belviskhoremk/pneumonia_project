<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pneumonia Detection</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Pneumonia Detection Platform</h1>
        <div class="form-container">
            <form id="upload-form">
                <div class="form-group">
                    <label for="model-select">Select Model(s):</label>
                    <!-- Hold Ctrl/Cmd to select several models: their predictions are averaged. -->
                    <select id="model-select" multiple>
                        {% for model_id, name in models.items() %}
                        <option value="{{ model_id }}" selected>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="image-upload">Upload Chest Image:</label>
                    <input type="file" id="image-upload" accept="image/*" required>
                </div>
                <button type="submit">Predict</button>
            </form>
            <div class="image-container">
                <img id="uploaded-image" src="#" alt="Uploaded Image" style="display: none; width: 100%; height: auto;"/>
            </div>
        </div>
        <div id="result" aria-live="polite"></div>
        <p class="disclaimer">For educational purposes only. Not a medical device and not a substitute for a diagnosis by a qualified professional.</p>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
